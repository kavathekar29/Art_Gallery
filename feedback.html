
<!DOCTYPE html>
<html>
<head>
    <title>Art Gallery - Feedback</title>
     <link rel="stylesheet" href="style.css">
</head>

<body>

    <center>

        <h1>🎨 ART GALLERY</h1>
        <p><b>We Value Your Feedback</b></p>

        <hr>

        <nav>
            <a href="index.html">Home</a> |
            <a href="login.html">Login</a> |
            <a href="register.html">Register</a> |
            <a href="feedback.html">Feedback</a>
        </nav>

        <hr>

        <h2>Feedback Form</h2>

        <form action="home.html">

            <table cellpadding="10">

                <tr>
                    <td>Name:</td>
                    <td>
                        <input type="text" name="name"
                        placeholder="Enter your name" required>
                    </td>
                </tr>

                <tr>
                    <td>Email:</td>
                    <td>
                        <input type="email" name="email"
                        placeholder="Enter your email" required>
                    </td>
                </tr>

                <tr>
                    <td>Rating:</td>
                    <td>
                        <input type="radio" name="rating" value="5"> ⭐⭐⭐⭐⭐
                        <br>
                        <input type="radio" name="rating" value="4"> ⭐⭐⭐⭐
                        <br>
                        <input type="radio" name="rating" value="3"> ⭐⭐⭐
                        <br>
                        <input type="radio" name="rating" value="2"> ⭐⭐
                        <br>
                        <input type="radio" name="rating" value="1"> ⭐
                    </td>
                </tr>

                <tr>
                    <td>Favourite Art:</td>
                    <td>
                        <select name="art">
                            <option>Select Art Type</option>
                            <option>Painting</option>
                            <option>Abstract Art</option>
                            <option>Portrait</option>
                            <option>Nature Art</option>
                            <option>Modern Art</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Your Feedback:</td>
                    <td>
                        <textarea name="feedback" rows="6" cols="30"
                        placeholder="Write your feedback here..."
                        required></textarea>
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="Submit Feedback">
                        <input type="reset" value="Clear">
                    </td>
                </tr>

            </table>

        </form>

        <hr>

        <h3>Thank You!</h3>

        <p>
            Thank you for visiting our Art Gallery.
            Your feedback helps us improve.
        </p>

        <hr>

        <p>
            <b>2026 Art Gallery. All Rights Reserved.</b>
        </p>

    </center>

</body>
</html>
